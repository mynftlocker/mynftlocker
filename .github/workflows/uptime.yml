# Surveillance gratuite : toutes les 30 minutes, verifie que le site et sa source de donnees (Sorare) repondent.
# En cas d'echec, GitHub t'envoie automatiquement un e-mail (etape en rouge = ce qui est en panne).
name: Surveillance du site
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: "1/3 Le site repond (mynftlocker.com)"
        run: |
          curl -fsS --max-time 25 --retry 3 --retry-delay 10 --retry-all-errors https://mynftlocker.com/ | grep -q "myNFTlocker"
      - name: "2/3 Le site lit bien les cartes Sorare"
        run: |
          curl -fsS --max-time 25 --retry 3 --retry-delay 10 --retry-all-errors "https://mynftlocker.com/api/cards?card=jonathan-kuminga-20021006-2026-limited-183" | grep -q '"card"'
      - name: "3/3 Sorare repond (api.sorare.com)"
        run: |
          curl -fsS --max-time 25 --retry 3 --retry-delay 10 --retry-all-errors -X POST -H 'Content-Type: application/json' -d '{"query":"query{__typename}"}' https://api.sorare.com/graphql | grep -q '"data"'
